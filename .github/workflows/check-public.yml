name: check-public
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No private record ids or links
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check-public.sh "origin/${{ github.base_ref }}..HEAD"
          else
            scripts/check-public.sh
          fi
